name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  NGX_VERSION: "1.29.8"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> "${GITHUB_ENV}"
          else
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build module export
        run: |
          docker buildx build \
            --cache-from type=gha,scope=brutal-nginx-rs-${NGX_VERSION} \
            --cache-to type=gha,mode=max,scope=brutal-nginx-rs-${NGX_VERSION} \
            --build-arg NGX_VERSION="${NGX_VERSION}" \
            -f Dockerfile-build \
            --target export \
            --output type=local,dest=build \
            .

      - name: Verify exported modules
        run: |
          test -s build/ngx_brutal_rs_module.so
          test -s build/debug_ngx_brutal_rs_module.so
          file build/ngx_brutal_rs_module.so
          file build/debug_ngx_brutal_rs_module.so

      - name: Package release assets
        run: |
          set -eux
          archive="brutal-nginx-rs-nginx-${NGX_VERSION}-${TAG_NAME}.tar.gz"
          (cd build && sha256sum ngx_brutal_rs_module.so debug_ngx_brutal_rs_module.so > SHA256SUMS)
          tar -C build -czf "${archive}" \
            ngx_brutal_rs_module.so \
            debug_ngx_brutal_rs_module.so \
            SHA256SUMS
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release view "${TAG_NAME}" || gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes "Built for nginx ${NGX_VERSION}."
          gh release upload "${TAG_NAME}" "${ARCHIVE}" --clobber
